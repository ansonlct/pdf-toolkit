<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="PDF Toolkit v1 — mobile-first local PDF workspace.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDF Toolkit">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>PDF Toolkit v1</title>
</head>
<body>
<header class="app-header" aria-label="主導覽列">
  <div class="header-inner">
    <div id="compactTitle" class="compact-title" aria-hidden="true">PDF Toolkit</div>
  </div>
</header>

<main class="app-main">
  <section class="workspace-head">
    <div class="workspace-title">
      <h1 id="largeTitle" class="large-title">PDF Toolkit</h1>
    </div>
  </section>

  <section class="tools-panel">
    <div class="panel-head"><h3>所有工具</h3><span id="toolCount" class="tool-count"></span></div>
    <div id="toolGrid" class="tool-sections"></div>

    <section class="app-settings-section" aria-labelledby="settingsTitle">
      <div id="settingsTitle" class="settings-section-title">設定</div>
      <div class="settings-list">
        <div class="settings-row settings-static-row">
          <span class="settings-icon settings-icon-theme" aria-hidden="true">◐</span>
          <span class="settings-label">深色模式</span>
          <label class="ios-switch" aria-label="深色模式">
            <input id="themeToggle" type="checkbox" role="switch">
            <span class="ios-switch-track"><span class="ios-switch-thumb"></span></span>
          </label>
        </div>
        <button id="paymeRow" class="settings-row donation-row" type="button">
          <span class="settings-icon settings-icon-payme" aria-hidden="true">P</span>
          <span class="settings-label">PayMe 捐款</span>
          <span class="settings-chevron" aria-hidden="true">›</span>
        </button>
        <button id="paypalRow" class="settings-row donation-row" type="button">
          <span class="settings-icon settings-icon-paypal" aria-hidden="true">P</span>
          <span class="settings-label">PayPal 捐款</span>
          <span class="settings-chevron" aria-hidden="true">›</span>
        </button>
      </div>
    </section>
  </section>
</main>

<div class="bottom-search-shell" id="bottomSearchShell">
  <label class="search bottom-search" aria-label="搜尋工具">
    <span aria-hidden="true">⌕</span>
    <input id="searchInput" type="search" placeholder="搜尋" autocomplete="off" inputmode="search">
  </label>
</div>

<footer class="app-footer">
  <span>PDF Toolkit v1</span>
  <span>Browser local processing · GitHub Pages / PWA</span>
</footer>

<dialog id="toolDialog">
  <div class="sheet">
    <div class="sheet-head">
      <button id="closeDialog" class="close tool-back" type="button" aria-label="返回">‹</button>
      <div class="sheet-title"><span id="dialogCat" class="eyebrow"></span><h2 id="dialogTitle"></h2></div>
      <div class="sheet-head-spacer" aria-hidden="true"></div>
    </div>

    <div class="sheet-scroll" id="toolScrollArea">
      <div class="sheet-content">
        <div id="dropZone" class="dropzone" tabindex="0" role="button">
          <input id="fileInput" hidden type="file">
          <div class="drop-icon">＋</div>
          <div><b id="dropTitle">選擇檔案</b><small>點按或拖放</small></div>
        </div>

        <div id="fileSummary" class="file-summary" hidden></div>
        <div id="workspace" class="workspace"></div>

        <div id="progressWrap" class="progress-wrap" hidden>
          <div><span id="progressText">處理中…</span><span id="progressPct">0%</span></div>
          <progress id="progressBar" max="100" value="0"></progress>
        </div>

        <div id="resultBox" class="result" hidden>
          <div class="result-info">
            <div class="result-status" aria-hidden="true">✓</div>
            <div class="result-copy"><b id="resultName"></b><small id="resultMeta"></small></div>
          </div>
          <div class="result-actions">
            <button id="downloadBtn" class="result-download" type="button">下載</button>
            <button id="shareBtn" class="result-share" type="button">分享</button>
          </div>
        </div>

        <div id="stickyActions" class="sticky-actions"></div>
        <p class="privacy-note">🔒 全面採用本地化資料處理，所有文件皆不會上傳至雲端或外部伺服器。</p>
      </div>
    </div>
  </div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdfsmaller/pdf-encrypt@1.2.0/dist/pdf-encrypt.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
